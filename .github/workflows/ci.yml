name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Also crawl once a day in CI against the mock site, so a broken parser shows up even without commits.
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: read

jobs:
  test:
    name: Lint, types, tests (with PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: freight_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/freight_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,browser]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=freight_pipeline --cov-report=term-missing

      - name: Browser mode against a live mock site (Playwright Chromium)
        run: |
          python -m playwright install --with-deps chromium
          nohup uvicorn mock_site.app:app --port 8900 > mock.log 2>&1 &
          sleep 3
          pytest -m browser
        env:
          FREIGHT_TEST_LIVE_URL: http://127.0.0.1:8900

      - name: Full run from the CLI (crawl → validate → load), report as artifact
        run: |
          freight migrate
          MOCK_FLAKY_EVERY=4 nohup uvicorn mock_site.app:app --port 8901 > mock-flaky.log 2>&1 &
          sleep 3
          freight run --no-publish
          freight runs
        env:
          FREIGHT_DATABASE_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/freight_test
          FREIGHT_SOURCE_BASE_URL: http://127.0.0.1:8901
          FREIGHT_REPORT_DIR: reports

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: reports/

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t freight-pipeline .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
